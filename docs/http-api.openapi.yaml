  "/operations/{operationId}":
    "get":
      "operationId": "getOperation"
      "summary": "Poll a token-owned mutation"
      "tags":
        - "Operations"
      "responses":
        "200":
          "description": "Authorized result."
          "headers":
            "X-Request-Id":
              "$ref": "#/components/headers/RequestId"
            "Cache-Control":
              "$ref": "#/components/headers/NoStore"
            "X-Content-Type-Options":
              "$ref": "#/components/headers/NoSniff"
            "ETag":
              "$ref": "#/components/headers/RepresentationETag"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Operation"
              "examples":
                "saved":
                  "value":
                    "id": "0123456789abcdef0123456789abcdef.0123456789abcdef0123456789abcdef"
                    "state": "succeeded"
                    "createdAt": "2026-11-01T00:00:00.000Z"
                    "completedAt": "2026-11-01T00:00:00.100Z"
                    "committed": true
                    "saved": true
                    "resource":
                      "id": "node-id"
                      "notebookId": "notebook-id"
                      "contentVersion": "saved-opaque"
                "conflictRecovery":
                  "summary": "Fetch/reconcile fresh saved content before considering another guarded request."
                  "value":
                    "id": "0123456789abcdef0123456789abcdef.0123456789abcdef0123456789abcdef"
                    "state": "failed"
                    "createdAt": "2026-11-01T00:00:00.000Z"
                    "completedAt": "2026-11-01T00:00:00.100Z"
                    "committed": false
                    "saved": false
                    "resource": {}
                    "error":
                      "status": 412
                      "code": "precondition_failed"
                      "title": "The note changed"
                "partialCreateInitialize":
                  "summary": "The prior empty create succeeded; this subsequent initialize failed. The empty resource still exists."
                  "value":
                    "id": "0123456789abcdef0123456789abcdef.abcdef0123456789abcdef0123456789"
                    "state": "failed"
                    "createdAt": "2026-11-01T00:00:01.000Z"
                    "completedAt": "2026-11-01T00:00:01.100Z"
                    "committed": false
                    "saved": false
                    "resource":
                      "id": "new-note-id"
                      "notebookId": "notebook-id"
                    "error":
                      "status": 409
                      "code": "unsaved_changes"
                      "title": "The note has unsaved changes"
        "400":
          "$ref": "#/components/responses/400"
        "401":
          "$ref": "#/components/responses/401"
        "403":
          "$ref": "#/components/responses/403"
        "404":
          "$ref": "#/components/responses/404"
        "405":
          "$ref": "#/components/responses/405"
        "409":
          "$ref": "#/components/responses/409"
        "410":
          "$ref": "#/components/responses/410"
        "412":
          "$ref": "#/components/responses/412"
        "413":
          "$ref": "#/components/responses/413"
        "422":
          "$ref": "#/components/responses/422"
        "429":
          "$ref": "#/components/responses/429"
        "503":
          "$ref": "#/components/responses/503"
      "x-required-scopes": []
      "parameters":
        -
          "$ref": "#/components/parameters/OperationId"
      "description": "Rechecks current token, notebook grant and original action scope. Other owners get404. Active operations are never evicted; at most16 global/4 per token. Retain at most256 completed for15 minutes. Old-instance, expired or evicted IDs give410. A dropped admission response is an unknown outcome, not safe permission to replay."
