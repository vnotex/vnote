"openapi": "3.1.0"
"jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema"
"info":
  "title": "VNote HTTP API"
  "version": "1.0.0"
  "description": "Opt-in owner-token note automation. Non-browser clients only. Embedded HTTP is literal loopback-only; external HTTPS terminates at an administrator-managed same-host reverse proxy. Every request requires bearer auth, strict upstream Host, no Origin or Cookie. No CORS, remote administration, arbitrary filesystem access, protected-note export, or permanent deletion. Full deployment and conflict/partial-outcome guidance: http-api.md."
"servers":
  -
    "url": "http://127.0.0.1:18765/api/v1"
    "description": "Default local loopback listener. For remote use configure a verified HTTPS gateway; never publicly expose this port."
"security":
  -
    "clientToken": []
"tags":
  -
    "name": "Discovery"
  -
    "name": "Notes"
  -
    "name": "Operations"
"paths":
