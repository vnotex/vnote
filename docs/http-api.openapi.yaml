            "X-Content-Type-Options":
              "$ref": "#/components/headers/NoSniff"
            "ETag":
              "$ref": "#/components/headers/RepresentationETag"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Info"
        "400":
          "$ref": "#/components/responses/400"
        "401":
          "$ref": "#/components/responses/401"
