<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VNoteX Markdown Viewer</title>

    <style type="text/css">
    /* VX_GLOBAL_STYLES_PLACEHOLDER */
    </style>

    <!-- VX_THEME_STYLES_PLACEHOLDER -->

    <!-- VX_STYLES_PLACEHOLDER -->

    <script type="text/javascript">
        /* VX_GLOBAL_OPTIONS_PLACEHOLDER */
    </script>

    <!-- VX_SCRIPTS_PLACEHOLDER -->
</head>
<body>
    <div id="body-container">
        <div id="vx-content"></div>
    </div>

    <div id="vx-image-view-box" class="vx-modal-box" style="display:none;">
        <span id="vx-image-view-close" class="vx-modal-close">&times;</span>
        <img id="vx-image-view" class="vx-modal-content" draggable="false">
        <div id="vx-image-view-controls">
            <button type="button" id="vx-image-view-zoom-in" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
            </button>
            <button type="button" id="vx-image-view-zoom-out" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
            </button>
            <button type="button" id="vx-image-view-reset" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
        </div>
        <div id="vx-image-view-error" role="status" hidden></div>
    </div>

    <div id="vx-preview" style="display:none;"></div>

    <!-- Need to be visible to let preview work -->
    <div id="vx-inplace-preview"></div>
</body>
</html>
