# Deployment-only policy for cargo-about 0.9.2. Order selects preferred OR licenses.
# https://embarkstudios.github.io/cargo-about/cli/generate/config.html
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "OpenSSL",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "LGPL-3.0-only",
]

targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
workarounds = ["ring", "rustls", "chrono", "cocoa"]
