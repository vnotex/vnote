name: CI-Windows

on:
  push:
    branches: [ v4.5.0_zyx ]
  pull_request:
    branches: [ v4.5.0_zyx ]

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: false

env:
    VNOTE_VER: 4.5.0.1

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: windows-${{ matrix.config.vs_version }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        config:
          # NOTE: do NOT add qtdeclarative to qt_modules. It is not an aqt
          # add-on module for Qt 6 -- it ships inside the base desktop package
          # -- and naming it makes aqt fail the whole install step with
          # "The packages ['qtdeclarative'] were not found while parsing XML of
          # package information!", before anything is even configured. Qt6::Qml
          # is available regardless (qtwebengine depends on it); the
          # "Verify test registration" step below is the gate that proves it.
          - name: "Build on Win64 Qt 6"
            arch: win64_msvc2022_64
            vs_version: 2022
            vs_cmd: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"
            qt: 6.10.3
            qt_modules: "qtwebengine qtwebchannel qtpositioning qtpdf qtimageformats qt5compat"
            qt_tools: tools_opensslv3_x64
            qt_major: 6
            suffix: ""
          - name: "Build on Win64 Qt 5.15"
            arch: win64_msvc2019_64
            vs_version: 2022
            vs_cmd: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"
            qt: 5.15.2
            qt_modules: qtwebengine
            qt_tools: tools_opensslv3_x64
            qt_major: 5
            suffix: "-windows7"

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE.
      - uses: actions/checkout@v2
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Init Submodules
        shell: bash
        run: |
          auth_header="$(git config --local --get http.https://github.com/.extraheader)"
          git submodule sync --recursive
          git -c "http.extraheader=$auth_header" -c protocol.version=2 submodule update --init --force --recursive --depth=1

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{runner.workspace}}/Qt
          key: ${{runner.os}}-${{matrix.config.arch}}-QtCache-${{matrix.config.qt}}

      - name: Setup MSVC v142 dev environment (Qt5 only)
        if: ${{ matrix.config.qt_major == 5 }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"
          toolset: "14.29"

      - name: Strip MinGW from PATH (Qt5 only)
        if: ${{ matrix.config.qt_major == 5 }}
        shell: pwsh
        run: |
          # windows-2022 ships with C:\mingw64\bin and C:\Strawberry on PATH.
          # CMake's compiler probe will pick gcc.exe before cl.exe and MinGW
          # silently wins. Strip these so cmake selects MSVC.
          $kept = $env:PATH -split ';' | Where-Object {
            $_ -and ($_ -notmatch '(?i)mingw') -and ($_ -notmatch '(?i)strawberry')
          }
          $newPath = ($kept -join ';')
          "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Stripped MinGW/Strawberry from PATH."

      - name: Install Qt Official Build
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{matrix.config.qt}}
          target: desktop
          arch: ${{matrix.config.arch}}
          modules: ${{matrix.config.qt_modules}}
          tools: ${{matrix.config.qt_tools}}
          cache: 'true'

      - name: Create Build Dir
        shell: bash
        run: mkdir build
        working-directory: ${{runner.workspace}}

      - name: Apply restore-section-numbering patch
        shell: bash
        run: |
          if git apply --check package/restore-section-numbering.patch 2>/dev/null; then
            git apply package/restore-section-numbering.patch
            echo "Applied package/restore-section-numbering.patch"
          elif git apply --reverse --check package/restore-section-numbering.patch 2>/dev/null; then
            echo "restore-section-numbering.patch already applied, skipping"
          else
            echo "ERROR: package/restore-section-numbering.patch does not apply cleanly"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # OpenSSL for the Qt 5.15 / Windows 7 variant.
      #
      # Qt 5.15 on Windows has NO Schannel TLS backend, so without a loadable
      # OpenSSL every HTTPS feature (update check, image hosting) dies with
      # "QSslSocket::connectToHostEncrypted: TLS initialization failed".
      # Qt 6 is unaffected (it falls back to Schannel) and git sync is unaffected
      # on both (libgit2 uses WinHTTP), so the blast radius is exactly those two
      # call sites.
      #
      # This replaced a clone of vnotex/openssl-utils pinned at 1.1.1j/Win_x64.
      # Those prebuilt DLLs import MSVCR100.dll -- the VC++ 2010 runtime, which is
      # neither in the package nor on a clean Windows 7/10/11 box -- so
      # LoadLibrary failed and the shipped 4.4.2 win7 build had no TLS at all.
      # 1.1.1j also predates CVE-2022-0778. Building 1.1.1w (the final 1.1.1
      # release) here links the modern UCRT/vcruntime140 that the package already
      # bundles, and keeps provenance inside this repo.
      #
      # These steps MUST stay after "Setup MSVC v142 dev environment" (which puts
      # cl/link/lib/nmake on PATH) and after "Strip MinGW from PATH" (which
      # persists the sanitized PATH through GITHUB_ENV). Do not move them earlier.
      # ---------------------------------------------------------------------
      - name: Cache OpenSSL 1.1.1w (Qt5 only)
        id: cache-openssl
        if: ${{ matrix.config.qt_major == 5 }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/openssl-1.1.1w-win64
          # Bump the trailing -vN whenever the recipe below changes.
          key: ${{runner.os}}-openssl-1.1.1w-vc142-x64-v1

      - name: Build OpenSSL 1.1.1w from source (Qt5 only)
        if: ${{ matrix.config.qt_major == 5 && steps.cache-openssl.outputs.cache-hit != 'true' }}
        shell: pwsh
        working-directory: ${{ runner.workspace }}
        env:
          OPENSSL_PREFIX: ${{ runner.workspace }}/openssl-1.1.1w-win64
        run: |
          $ErrorActionPreference = 'Stop'

          # Perl is required by OpenSSL's Configure. Make it available for THIS
          # STEP ONLY -- writing it to $GITHUB_ENV would undo the deliberate
          # MinGW/Strawberry strip that keeps CMake from picking gcc over cl.
          # Only Strawberry's perl\bin is prepended; its gcc lives in c\bin.
          $env:PATH = "C:\Strawberry\perl\bin;$env:PATH"
          $perlOk = $false
          if (Get-Command perl -ErrorAction SilentlyContinue) {
            & perl -v | Out-Null
            $perlOk = ($LASTEXITCODE -eq 0)
          }
          if (-not $perlOk) {
            throw ('perl is not available. OpenSSL cannot be configured without it. ' +
                   'Fallback: add a shogo82148/actions-setup-perl@v1 step gated on ' +
                   'matrix.config.qt_major == 5 before this one (it installs a perl with ' +
                   'no gcc alongside it).')
          }

          $url = 'https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz'
          $expectedSha = 'cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8'
          $tarball = Join-Path (Get-Location) 'openssl-1.1.1w.tar.gz'

          curl.exe -sSL --fail -o $tarball $url
          if ($LASTEXITCODE -ne 0) { throw "Failed to download $url" }

          $actualSha = (Get-FileHash -LiteralPath $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $expectedSha) {
            throw "openssl-1.1.1w.tar.gz SHA-256 mismatch: got $actualSha, expected $expectedSha"
          }
          Write-Host "SHA-256 verified: $actualSha"

          tar -xzf $tarball
          if ($LASTEXITCODE -ne 0) { throw "Failed to extract $tarball" }

          $src = Join-Path (Get-Location) 'openssl-1.1.1w'
          if (-not (Test-Path -LiteralPath $src)) { throw "Extracted source dir not found: $src" }

          # runner.workspace is a backslash path but the env value mixes in forward
          # slashes; OpenSSL bakes --openssldir into the binaries, so normalize.
          $out = $env:OPENSSL_PREFIX.Replace('/', '\')
          Push-Location $src
          try {
            # no-asm drops the NASM dependency (MSVC's assembler still covers
            # OpenSSL's small Windows shim). Crypto throughput is irrelevant for
            # an update check and an occasional image upload. VC-WIN64A builds
            # shared by default and produces bin\libssl-1_1-x64.dll /
            # bin\libcrypto-1_1-x64.dll -- exactly the names the pinned Qt 5.15.2
            # dlopens. Both "asm" and "tests" are in 1.1.1w's @disablables.
            & perl Configure VC-WIN64A no-asm no-tests "--prefix=$out" "--openssldir=$out\ssl"
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL Configure failed" }
            & nmake
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL nmake failed" }
            & nmake install_sw
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL nmake install_sw failed" }
          }
          finally {
            Pop-Location
          }

          # OpenSSL 1.1.1's dual OpenSSL/SSLeay license requires reproducing the
          # copyright notice with binary redistribution. Keep the notice INSIDE
          # the cached prefix so a cache hit still has it for the install rule in
          # src/Packaging.cmake.
          Copy-Item -LiteralPath (Join-Path $src 'LICENSE') -Destination (Join-Path $out 'LICENSE.OpenSSL') -Force
          Write-Host "OpenSSL 1.1.1w installed to $out"

      - name: Validate OpenSSL import tables (Qt5 only)
        # Runs on cache HIT and MISS alike, so a cache holding an INCOMPLETE or
        # wrongly-linked prefix fails here instead of shipping. This is the gate
        # that would have caught the MSVCR100.dll regression in 4.4.2.
        #
        # SCOPE: this checks COMPOSITION -- import-table names plus file presence.
        # It is NOT an integrity check and does not detect a substituted DLL that
        # keeps the same import table. Content is pinned only by the SHA-256 of
        # the source tarball, which is verified in the build step above and is
        # therefore skipped on a cache hit.
        id: openssl-deps
        if: ${{ matrix.config.qt_major == 5 }}
        shell: pwsh
        env:
          OPENSSL_PREFIX: ${{ runner.workspace }}/openssl-1.1.1w-win64
        run: |
          $ErrorActionPreference = 'Stop'
          $out = $env:OPENSSL_PREFIX

          $required = @(
            (Join-Path $out 'bin\libssl-1_1-x64.dll'),
            (Join-Path $out 'bin\libcrypto-1_1-x64.dll'),
            (Join-Path $out 'LICENSE.OpenSSL')
          )
          foreach ($f in $required) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Missing required OpenSSL artifact: $f" }
          }

          # dumpbin INDENTS its dependency lines, so the output must be parsed
          # into trimmed basenames before matching. A regex applied to the raw
          # output would not have matched the shipped "    MSVCR100.dll".
          function Get-DllDependencies([string] $p_path) {
            # Function-scoped: reverts on return. Native stderr merged with 2>&1
            # becomes an ErrorRecord, which 'Stop' would turn into a throw before
            # the exit-code check below ever runs.
            $ErrorActionPreference = 'Continue'
            $raw = & dumpbin /dependents $p_path 2>&1
            $code = $LASTEXITCODE
            if ($code -ne 0) { throw "dumpbin failed for ${p_path}: $raw" }
            $deps = @()
            $inSection = $false
            foreach ($line in $raw) {
              $text = [string]$line
              if ($text -match 'Image has the following (delay load )?dependencies:') {
                $inSection = $true
                continue
              }
              if (-not $inSection) { continue }
              if ($text -match '^\s*Summary') { $inSection = $false; continue }
              $trimmed = $text.Trim()
              if ($trimmed -match '^[^\s]+\.dll$') { $deps += $trimmed }
            }
            return $deps
          }

          # OpenSSL is C: it needs neither the legacy C runtime nor the C++ one.
          $forbidden = @('(?i)^msvcr\d+\.dll$', '(?i)^msvcp\d+\.dll$')
          # System DLLs present on every supported Windows; not shipped by us.
          $systemAllow = @(
            '(?i)^kernel32\.dll$', '(?i)^advapi32\.dll$', '(?i)^user32\.dll$',
            '(?i)^ws2_32\.dll$', '(?i)^crypt32\.dll$', '(?i)^bcrypt\.dll$'
          )
          # Modern runtime family: allowed, but MUST be present in the package
          # (asserted by the post-extraction step further down).
          $runtimeAllow = @(
            '(?i)^vcruntime140.*\.dll$', '(?i)^ucrtbase\.dll$', '(?i)^api-ms-win-.*\.dll$'
          )
          # libssl links against libcrypto -- that is the whole point of the pair.
          # Accept only those two exact names, and do NOT feed them into
          # $nonSystem: the pair's presence in the package is already asserted by
          # name in the post-extraction step, so re-deriving it here would be
          # circular. Keep these EXACT; never widen to lib*.dll.
          $opensslPair = @('(?i)^libssl-1_1-x64\.dll$', '(?i)^libcrypto-1_1-x64\.dll$')

          $nonSystem = New-Object System.Collections.Generic.HashSet[string]
          foreach ($dll in @('libssl-1_1-x64.dll', 'libcrypto-1_1-x64.dll')) {
            $path = Join-Path $out "bin\$dll"
            $deps = Get-DllDependencies $path
            Write-Host "$dll -> $($deps -join ', ')"
            if (-not $deps) { throw "dumpbin reported no dependencies for $dll; refusing to trust the parse" }

            foreach ($dep in $deps) {
              foreach ($re in $forbidden) {
                if ($dep -match $re) {
                  throw ("$dll imports $dep. OpenSSL is C and needs neither the legacy C runtime " +
                         "nor the C++ runtime; this is exactly the regression that shipped in 4.4.2.")
                }
              }
              $isSystem = ($systemAllow | Where-Object { $dep -match $_ }).Count -gt 0
              $isRuntime = ($runtimeAllow | Where-Object { $dep -match $_ }).Count -gt 0
              $isPair = ($opensslPair | Where-Object { $dep -match $_ }).Count -gt 0
              if (-not ($isSystem -or $isRuntime -or $isPair)) {
                throw ("$dll imports unexpected dependency '$dep'. Review it explicitly rather " +
                       "than widening the allowlist by reflex.")
              }
              if (-not ($isSystem -or $isPair)) { [void]$nonSystem.Add($dep) }
            }
          }

          $list = @($nonSystem) | Sort-Object
          Write-Host "Non-system OpenSSL dependencies that must ship in the package: $($list -join ', ')"
          # `validated` is a separate marker from `nonsystem` on purpose. An empty
          # nonsystem list is LEGITIMATE (it would mean OpenSSL statically linked
          # the CRT), so the downstream step must not read "empty" as "this gate
          # never ran". It asserts `validated` instead, which is only ever written
          # here after every dependency has been classified.
          #
          # The name filter is deliberately stricter than the parser's: these
          # values are tool-derived and are consumed by another step, so keep them
          # to a conservative character class.
          foreach ($n in $list) {
            if ($n -notmatch '^[A-Za-z0-9._-]+\.dll$') {
              throw "Refusing to publish dependency name with unexpected characters: '$n'"
            }
          }
          "nonsystem=$($list -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "validated=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      # NOTE on the `7z x VNote*.zip` below: extract IN PLACE, never with `-o*`.
      # The CPack ZIP already carries a single top-level VNote-x.y.z-win64/
      # directory, so `-o*` (which names the output directory after the archive)
      # nests it twice and leaves the install root two levels down. Downstream
      # steps -- scripts/gen-update-package.ps1 above all -- require
      # build/VNote-x.y.z-win64/ to BE the install root.
      - name: Configure and Build Project
        shell: cmd
        env:
          QT_MAJOR: ${{ matrix.config.qt_major }}
          VS_CMD: ${{ matrix.config.vs_cmd }}
          # Qt 5 has no Schannel TLS backend and MUST ship OpenSSL; Qt 6 uses
          # Schannel and deliberately ships none, so it passes empty values here
          # rather than a path that only ever exists for Qt 5.
          # src/Packaging.cmake turns a missing pair into a FATAL_ERROR on Qt 5.
          VX_OPENSSL_EXTRA_LIB_DIR: ${{ matrix.config.qt_major == 5 && format('{0}/openssl-1.1.1w-win64/bin', runner.workspace) || '' }}
          VX_OPENSSL_LICENSE_FILE: ${{ matrix.config.qt_major == 5 && format('{0}/openssl-1.1.1w-win64/LICENSE.OpenSSL', runner.workspace) || '' }}
          # tests/CMakeLists.txt hard-requires Qt6 (find_package(Qt6 REQUIRED)),
          # so the Qt5 matrix entry MUST build packaging-only. Qt6 entry builds
          # tests so the Build-and-Run-Tests step below can ctest them.
          VNOTE_TESTS: ${{ matrix.config.qt_major == 6 && 'ON' || 'OFF' }}
        run: |
          cmake --version
          if "%QT_MAJOR%"=="6" call "%VS_CMD%"
          where cl || echo "cl.exe not on PATH"
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DQT_DEFAULT_MAJOR_VERSION=%QT_MAJOR% -DVNOTE_BUILD_TESTS=%VNOTE_TESTS% -DOPENSSL_EXTRA_LIB_DIR=%VX_OPENSSL_EXTRA_LIB_DIR% -DOPENSSL_LICENSE_FILE=%VX_OPENSSL_LICENSE_FILE% %GITHUB_WORKSPACE% > cmake-configure.log 2>&1 || (type cmake-configure.log && exit /b 1)
          type cmake-configure.log
          REM cmd reports only the LAST command's exit code, so every step here
          REM needs its own `|| exit /b 1`. Without them a failed build (and the
          REM failed pack and failed extraction that follow it) was reported as
          REM a green step, and the run only died later in a packaging gate.
          cmake --build . || exit /b 1
          cmake --build . --target=pack || exit /b 1
          7z x VNote*.zip || exit /b 1
          dir
        working-directory: ${{runner.workspace}}/build

      - name: Verify test registration (Qt6 only)
        # test_pdfviewercore_js is guarded on TARGET Qt6::Qml. If qtdeclarative
        # is missing from the Qt install, CMake silently skips the target and the
        # ONLY gate covering the PDF outline JS contract disappears from an
        # otherwise green run. A bare `ctest -N | Select-String ...` exits 0 even
        # with no match, so the check has to be made fatal explicitly.
        if: ${{ matrix.config.qt_major == 6 }}
        shell: pwsh
        run: |
          $registered = ctest -C Release -N | Select-String -SimpleMatch "test_pdfviewercore_js"
          if (-not $registered) {
            throw "test_pdfviewercore_js not registered; Qt6::Qml (qtdeclarative) missing"
          }
        working-directory: ${{runner.workspace}}/build

      - name: Build and Run Tests (Qt6 only)
        # tests/CMakeLists.txt hard-requires Qt6 so this step is skipped on
        # the Qt5 matrix entry. The previous step already built tests when
        # VNOTE_BUILD_TESTS=ON, so ctest only needs to dispatch them.
        if: ${{ matrix.config.qt_major == 6 }}
        shell: cmd
        env:
          VS_CMD: ${{ matrix.config.vs_cmd }}
        run: |
          call "%VS_CMD%"
          ctest -C Release --output-on-failure
        working-directory: ${{runner.workspace}}/build

      - name: Re-run failed tests with extra-verbose output (debug aid)
        # On failure of the previous step, re-run only the failing tests with
        # --extra-verbose so Qt Test's PASS/FAIL lines + assertion details
        # land in the CI log. The QTEST_MAIN crash-handler workaround
        # (-nocrashhandler in CMakeLists) silences the default Qt Test stdout
        # path; --output-on-failure alone often shows nothing useful. This
        # step never gates the workflow (|| exit 0) - it's pure diagnostics.
        if: ${{ failure() && matrix.config.qt_major == 6 }}
        shell: cmd
        env:
          VS_CMD: ${{ matrix.config.vs_cmd }}
        run: |
          call "%VS_CMD%"
          ctest -C Release --rerun-failed --extra-verbose || exit 0
        working-directory: ${{runner.workspace}}/build

      - name: Assert MSVC v142 + Qt 5.15.2 in use
        if: ${{ matrix.config.qt_major == 5 }}
        shell: bash
        working-directory: ${{ runner.workspace }}/build
        run: |
          grep -E "MSVC.*19\.29|Compiler.*19\.29" cmake-configure.log || (echo "v142 toolset NOT in use" && exit 1)
          grep -E "Found Qt5.*5\.15\.2|Qt5 .*5\.15\.2|5\.15\.2" cmake-configure.log || (echo "Qt 5.15.2 not found" && exit 1)
          echo "v142 + Qt 5.15.2 verified"

      - name: Rename on 5.15
        shell: bash
        if: ${{ startsWith(matrix.config.qt, '5.15') }}
        working-directory: ${{ runner.workspace }}/build
        run: |
          mv VNote-${VNOTE_VER}-win64 VNote-${VNOTE_VER}-win64-windows7 || true
          mv VNote-${VNOTE_VER}-win64.zip VNote-${VNOTE_VER}-win64-windows7.zip || true

      # Runs for BOTH variants and on EVERY build, not just releases: this is
      # the gate proving package/prune-package.cmake actually ran. If the CPack
      # hook is ever renamed or silently skipped, the SDK artifacts come back
      # and the only symptom is a slightly larger ZIP -- exactly the kind of
      # regression that reaches users unnoticed.
      - name: Verify package ships no SDK artifacts
        shell: pwsh
        working-directory: ${{runner.workspace}}/build
        run: |
          $extracted = "VNote-${{env.VNOTE_VER}}-win64${{matrix.config.suffix}}"
          if (-not (Test-Path -LiteralPath $extracted)) {
            Write-Error "Extracted dir '$extracted' not found"; exit 1
          }
          # Everything VNote loads lives at the package root, so any of these
          # directories is by definition not a runtime dependency.
          $forbidden = @('bin', 'include', 'lib', 'mkspecs')
          $found = @($forbidden | Where-Object { Test-Path -LiteralPath (Join-Path $extracted $_) })
          if ($found) {
            foreach ($f in $found) {
              Get-ChildItem -Recurse -File (Join-Path $extracted $f) |
                Select-Object -First 20 |
                ForEach-Object { Write-Host "   $($_.FullName)" }
            }
            Write-Error "Package ships SDK/dev artifacts ($($found -join ', ')); prune-package.cmake did not run"
            exit 1
          }

          # cmark's CLI is installed by the vendored cmark and, with the flat
          # layout, lands in the package root. VNote links cmark as a library
          # and never runs it. vnote.exe and QtWebEngineProcess.exe are the only
          # executables the package should carry.
          $strayExe = @(Get-ChildItem -File -Filter '*.exe' $extracted |
                        Where-Object { $_.Name -notin @('vnote.exe', 'QtWebEngineProcess.exe') })
          if ($strayExe) {
            Write-Error "Package ships unexpected executable(s): $($strayExe.Name -join ', ')"
            exit 1
          }
          Write-Host "No SDK artifacts under $extracted"

      # The import-table gate above proves the OpenSSL DLLs need only the modern
      # runtime family. This one proves that family is actually IN the package,
      # which cannot be checked earlier: the package does not exist until
      # `cmake --build . --target=pack` + `7z x` have run.
      - name: Verify OpenSSL runtime dependencies ship in the package (Qt5 only)
        if: ${{ matrix.config.qt_major == 5 }}
        shell: pwsh
        working-directory: ${{runner.workspace}}/build
        env:
          # Read through env, NOT `${{ }}` interpolation. These values are derived
          # from dumpbin output rather than authored in this workflow, and
          # `${{ }}` is substituted textually before pwsh parses the script, so a
          # quote in the value would break out of the string literal.
          VX_OPENSSL_NONSYSTEM: ${{ steps.openssl-deps.outputs.nonsystem }}
          VX_OPENSSL_VALIDATED: ${{ steps.openssl-deps.outputs.validated }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extracted = "VNote-${{env.VNOTE_VER}}-win64-windows7"
          if (-not (Test-Path -LiteralPath $extracted)) {
            throw "Extracted dir '$extracted' not found"
          }

          foreach ($dll in @('libssl-1_1-x64.dll', 'libcrypto-1_1-x64.dll', 'LICENSE.OpenSSL')) {
            if (-not (Test-Path -LiteralPath (Join-Path $extracted $dll))) {
              throw "Package is missing $dll -- Qt 5 has no Schannel fallback, so TLS would be dead"
            }
          }

          # Assert the gate actually RAN. Reading emptiness of `nonsystem` for
          # this would misfire on a legitimately empty list (statically-linked
          # CRT), so the import-table step publishes an explicit marker.
          if ($env:VX_OPENSSL_VALIDATED -ne 'true') {
            throw "The OpenSSL import-table step did not report success; refusing to pass vacuously"
          }
          $missing = @()
          $checked = @()
          foreach ($dep in ("$env:VX_OPENSSL_NONSYSTEM" -split ',')) {
            $name = $dep.Trim()
            if (-not $name) { continue }
            $checked += $name
            if (-not (Test-Path -LiteralPath (Join-Path $extracted $name))) { $missing += $name }
          }
          if ($missing) {
            throw ("OpenSSL depends on $($missing -join ', ') but the package does not ship " +
                   "them; the DLLs would fail to load on a clean Windows 7 box")
          }
          if ($checked) {
            Write-Host "All non-system OpenSSL dependencies present in $extracted ($($checked -join ', '))"
          } else {
            Write-Host "OpenSSL has no non-system dependencies to verify"
          }

      # The final TLS gate: the only check that proves the SHIPPED DLLs actually
      # initialize TLS in the SHIPPED Qt build. The import-table and
      # package-presence checks above cover "are the transitive dependencies
      # there"; this one covers "does Qt actually come up with SSL". All three
      # are needed; none replaces the others.
      - name: Probe TLS in the packaged Qt5 build
        if: ${{ matrix.config.qt_major == 5 }}
        shell: pwsh
        working-directory: ${{runner.workspace}}/build
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "VNote-${{env.VNOTE_VER}}-win64-windows7"
          if (-not (Test-Path -LiteralPath $pkg)) { throw "Extracted dir '$pkg' not found" }

          $probe = Join-Path (Get-Location) 'tools\tlsprobe\tlsprobe.exe'
          if (-not (Test-Path -LiteralPath $probe)) { throw "tlsprobe.exe not built at $probe" }

          # Copying the probe INTO the package directory is deliberate: Windows
          # searches the executable's own directory first, so this reproduces
          # vnote.exe's real load context, which is what actually failed. Running
          # it from the build tree with the package merely on PATH would let the
          # Qt install directory shadow the packaged DLLs.
          #
          # The ZIP was already produced by CPack before extraction, so this does
          # not alter the published artifact; the Remove-Item is hygiene. Qt 5
          # runs no gen-update-package.ps1, so there is no manifest interaction.
          $copied = Join-Path $pkg 'tlsprobe.exe'
          Copy-Item -LiteralPath $probe -Destination $copied -Force
          Push-Location $pkg
          try {
            .\tlsprobe.exe
            $rc = $LASTEXITCODE
          }
          finally {
            Pop-Location
            Remove-Item -LiteralPath $copied -Force -ErrorAction SilentlyContinue
          }
          # The stray-executable gate already ran, and Archive Artifacts uploads
          # this directory afterwards, so a silently-failed delete would publish
          # the probe. Assert the removal rather than hoping.
          if (Test-Path -LiteralPath $copied) {
            throw "Failed to remove $copied from the package directory"
          }
          if ($rc -ne 0) { throw "Packaged Qt5 build cannot initialize TLS (tlsprobe exit $rc)" }
          Write-Host "Packaged Qt5 build initializes TLS"

      # Update manifest / delta artifacts. MUST run after the Qt5 rename (so the
      # variant name is final) and before the composition check below (which
      # inspects the extracted directory, now including manifest.json).
      #
      # NOTE: the VNote client no longer consumes these at all -- it only checks
      # for a newer release and points the user at the release page (see the
      # "Update Check" section of the root AGENTS.md). They are published as the
      # artifact interface for a future EXTERNAL updater; see
      # docs/update-signing.md.
      #
      # The MSI was produced earlier by `cmake --build . --target=pack`, so it
      # does NOT contain manifest.json. That is intentional and unchanged.
      #
      # Qt6 / `win64` ONLY. The Qt5 `win64-windows7` variant deliberately ships
      # no update assets; nothing depends on them, so generating them for that
      # variant would only add build surface.
      - name: Generate update manifest and delta
        # Update artifacts are only meaningful for a real release. This repo
        # cuts releases from a `[Release]` master push (the tag is created
        # afterwards), so gate on that exact predicate -- identical to the
        # `Release` step below. Non-release commits (PRs, continuous master
        # builds) skip manifest/delta generation entirely; those channels never
        # publish update assets, so producing them only risks failing the build.
        if: matrix.config.qt_major == 6 && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, '[Release]')
        shell: pwsh
        working-directory: ${{runner.workspace}}/build
        env:
          # The token at the continuous-build step is scoped to that step only,
          # so the generator needs its own. It uses `gh` to resolve the previous
          # STABLE release and download its published manifest.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Ed25519 signing key for the release manifest. The client REFUSES any
          # manifest it cannot verify, so an unsigned release is inert. Absent
          # on forks and on PRs from forks, where the generator warns instead.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # Channel is derived from THIS workflow's real release predicate,
          # identical to the `Release` step's condition below. It must NOT be
          # keyed on "was this a tag build": this repo cuts releases from a
          # master push and creates the tag afterwards via ncipollo, so a
          # tag-based rule would stamp every official release "continuous".
          $isRelease = ('${{ github.ref }}' -eq 'refs/heads/master') -and
                       ('${{ startsWith(github.event.head_commit.message, '[Release]') }}' -eq 'true')
          $channel = if ($isRelease) { 'stable' } else { 'continuous' }
          Write-Host "Update channel: $channel"

          # MUST be a HASHTABLE, never an array. PowerShell array splatting
          # binds elements POSITIONALLY: `@('-MinisignSecretKey', $keyPath)`
          # sent the literal string "-MinisignSecretKey" to -OutputDir and the
          # key path to -BaseManifestPath, leaving -MinisignSecretKey empty. The
          # 4.4.1 build wrote its ZIP into a directory called
          # "-MinisignSecretKey", tried to parse the minisign private key as
          # JSON, and would have published an UNSIGNED manifest that every
          # client refuses.
          $signArgs = @{}
          if ($env:MINISIGN_SECRET_KEY) {
            # minisign is not preinstalled on the runner image.
            $msVer = '0.11'
            $msZip = Join-Path $env:RUNNER_TEMP 'minisign.zip'
            $msDir = Join-Path $env:RUNNER_TEMP 'minisign'
            curl.exe -sSL -o $msZip "https://github.com/jedisct1/minisign/releases/download/$msVer/minisign-$msVer-win64.zip"
            Expand-Archive -Path $msZip -DestinationPath $msDir -Force
            $msExe = (Get-ChildItem $msDir -Recurse -Filter minisign.exe | Select-Object -First 1).DirectoryName
            $env:PATH = "$msExe;$env:PATH"

            # Materialize the key outside the workspace so it can never be
            # picked up by a packaging glob, and remove it in the finally block.
            $keyPath = Join-Path $env:RUNNER_TEMP 'minisign.key'
            Set-Content -LiteralPath $keyPath -Value $env:MINISIGN_SECRET_KEY -NoNewline
            $signArgs['MinisignSecretKey'] = $keyPath
          }
          elseif ($isRelease) {
            # HARD FAIL. Publishing an unsigned manifest is worse than failing
            # the build: every client REFUSES a manifest it cannot verify, so
            # the release would look fine and silently break updates for
            # everyone. The most likely cause is the secret being defined as an
            # ENVIRONMENT secret while this job declares no `environment:`, in
            # which case ${{ secrets.* }} silently resolves to an empty string.
            Write-Error ("MINISIGN_SECRET_KEY is not available, but this is a RELEASE build. " +
              "Refusing to publish an unsigned manifest. If the secret is defined under " +
              "Settings > Environments, either move it to Settings > Secrets and variables > " +
              "Actions, or add an `environment:` key to this job. See docs/update-signing.md.")
            exit 1
          }
          else {
            Write-Warning "MINISIGN_SECRET_KEY is not set; this build's manifest will be UNSIGNED."
          }

          try {
            $variant = 'win64${{matrix.config.suffix}}'
            & "$env:GITHUB_WORKSPACE/scripts/gen-update-package.ps1" `
                -ExtractedDir "VNote-${{env.VNOTE_VER}}-$variant" `
                -Version "${{env.VNOTE_VER}}" `
                -Variant $variant `
                -Commit "${{ github.sha }}" `
                -Channel $channel `
                @signArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            $keyPath = Join-Path $env:RUNNER_TEMP 'minisign.key'
            if (Test-Path -LiteralPath $keyPath) {
              Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Assert update manifest channel
        # Only runs when the previous step generated the manifests, i.e. on a
        # `[Release]` master push of the Qt6 / `win64` variant.
        if: matrix.config.qt_major == 6 && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, '[Release]')
        shell: pwsh
        working-directory: ${{runner.workspace}}/build
        run: |
          # The channel field is what stops a continuous build from ever being
          # accepted as a delta base, so it is asserted rather than trusted.
          $isRelease = ('${{ github.ref }}' -eq 'refs/heads/master') -and
                       ('${{ startsWith(github.event.head_commit.message, '[Release]') }}' -eq 'true')
          $expected = if ($isRelease) { 'stable' } else { 'continuous' }

          $variant = 'win64${{matrix.config.suffix}}'
          foreach ($path in @("VNote-${{env.VNOTE_VER}}-$variant/manifest.json",
                              "VNote-${{env.VNOTE_VER}}-$variant.manifest.json")) {
            if (-not (Test-Path -LiteralPath $path)) { Write-Error "Missing $path"; exit 1 }
            $manifest = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            if ($manifest.channel -ne $expected) {
              Write-Error "$path declares channel '$($manifest.channel)', expected '$expected'"
              exit 1
            }
            if ($manifest.variant -ne $variant) {
              Write-Error "$path declares variant '$($manifest.variant)', expected '$variant'"
              exit 1
            }
            if ($manifest.version -ne '${{env.VNOTE_VER}}') {
              Write-Error "$path declares version '$($manifest.version)', expected '${{env.VNOTE_VER}}'"
              exit 1
            }
          }
          Write-Host "Manifest channel/variant/version verified ($expected)"

          # A release manifest that is not signed is INERT: every client refuses
          # a manifest it cannot verify, so the release would look healthy and
          # silently break updates for everyone. The 4.4.1 splatting bug proved
          # this can happen without any error, so assert the signature exists
          # rather than trusting that -MinisignSecretKey was bound.
          if ($isRelease) {
            $sig = "VNote-${{env.VNOTE_VER}}-$variant.manifest.json.minisig"
            if (-not (Test-Path -LiteralPath $sig)) {
              Write-Error "Missing $sig -- refusing to publish an unsigned release manifest"
              exit 1
            }
            Write-Host "Release manifest signature present ($sig)"
          }

          # The generator writes beside the extracted directory. A stray
          # directory here means an argument was mis-bound (see the hashtable
          # note above) and the real assets are not where Release expects them.
          $strays = @(Get-ChildItem -Directory -Force |
                      Where-Object { $_.Name -like '-*' })
          if ($strays) {
            Write-Error "Unexpected directory from a mis-bound argument: $($strays.Name -join ', ')"
            exit 1
          }

      - name: Verify Qt5 zip composition
        if: ${{ startsWith(matrix.config.qt, '5.15') }}
        shell: pwsh
        working-directory: ${{runner.workspace}}/build
        run: |
          $extracted = "VNote-${{env.VNOTE_VER}}-win64-windows7"
          Write-Host "PWD: $(Get-Location)"
          Write-Host "Build dir entries:"
          Get-ChildItem -Force | Select-Object Mode, Name | Format-Table | Out-String | Write-Host
          if (-not (Test-Path $extracted)) {
            Write-Host "Extracted dir '$extracted' not present; falling back to VNote-${{env.VNOTE_VER}}-win64"
            $extracted = "VNote-${{env.VNOTE_VER}}-win64"
          }
          if (-not (Test-Path $extracted)) { Write-Error "Neither extracted dir found"; exit 1 }
          Write-Host "Inspecting '$extracted':"
          Get-ChildItem -Force $extracted | Select-Object Mode, Name | Format-Table | Out-String | Write-Host

          # vnote.exe MUST sit directly in the extracted root, not in a nested
          # "VNote-<ver>-win64/" or "bin/" subdirectory: the extracted dir is
          # what scripts/gen-update-package.ps1 treats as the install root, and
          # the updater strips exactly one level from a full package. This ran
          # -Recurse before, which is why a two-level-deep layout went unnoticed
          # until the release-only manifest step first executed.
          $rootExe = Join-Path $extracted 'vnote.exe'
          if (-not (Test-Path -LiteralPath $rootExe)) {
            Write-Error "vnote.exe is not at the root of $extracted (install root must be flat)"
            Get-ChildItem -Recurse -Filter vnote.exe $extracted | ForEach-Object { Write-Host "  found at: $($_.FullName)" }
            exit 1
          }
          Write-Host "vnote.exe -> $((Get-Item -LiteralPath $rootExe).FullName)"

          foreach ($dll in @('Qt5Core.dll','Qt5WebEngineCore.dll','QtWebEngineProcess.exe')) {
            $hit = Get-ChildItem -Path $extracted -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $hit) { Write-Error "$dll missing under $extracted"; exit 1 }
            Write-Host "$dll -> $($hit.FullName)"
          }

          $qt6 = Get-ChildItem -Recurse $extracted -Filter "Qt6*.dll" -ErrorAction SilentlyContinue
          if ($qt6) { Write-Error "Qt6 DLLs leaked into Qt5 build: $($qt6 -join ', ')"; exit 1 }
          Write-Host "Qt5 zip composition OK"

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VNote-${{env.VNOTE_VER}}-win64${{matrix.config.suffix}}
          path: ${{runner.workspace}}/build/VNote-${{env.VNOTE_VER}}-win64${{matrix.config.suffix}}

      - name: Archive Installer
        if: ${{ !startsWith(matrix.config.qt, '5.15') }}
        uses: actions/upload-artifact@v4
        with:
          name: VNote-${{env.VNOTE_VER}}-win64${{matrix.config.suffix}}.msi
          path: ${{runner.workspace}}/build/VNote*.msi

      - name: Update Continuous Build Release
        # Release pushes are EXCLUDED. Without this a `[Release]` push would
        # generate one `stable`-stamped ZIP and then copy that same ZIP to the
        # `continuous-build` prerelease, which (a) makes the two channel
        # assertions unsatisfiable and (b) republishes the official release as a
        # continuous prerelease.
        if: >-
          github.ref == 'refs/heads/master' &&
          !startsWith(github.event.head_commit.message, '[Release]')
        shell: bash
        working-directory: ${{runner.workspace}}/build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh release commands run from build/ (not a git checkout), so gh's
          # git-based repo auto-detection fails ("fatal: not a git repository").
          # GH_REPO makes every gh command target the repo without needing git.
          GH_REPO: ${{ github.repository }}
          SUFFIX: ${{matrix.config.suffix}}
        run: |
          set -e
          # Ensure the release + tag exist (idempotent; all jobs share GITHUB_SHA).
          gh release create continuous-build \
            --target "$GITHUB_SHA" \
            --title "Continuous Build" \
            --prerelease \
            --notes "Continuous build from master ($GITHUB_SHA)." || true
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/continuous-build" \
            -F sha="$GITHUB_SHA" -F force=true || true

          STABLE="VNote-continuous-win64${SUFFIX}.zip"

          # Copy the built artifact to a stable, non-versioned name.
          cp "VNote-${VNOTE_VER}-win64${SUFFIX}.zip" "$STABLE"

          # Prune only this job's own asset family. The two regexes are mutually
          # exclusive: win64\.zip$ does NOT match ...win64-windows7.zip.
          # The incremental-update assets (.manifest.json / .delta.zip) are
          # deliberately NOT published to continuous-build, and neither regex
          # matches them (both end in \.zip$ and the delta ends in .delta.zip,
          # which win64\.zip$ / win64-windows7\.zip$ cannot match).
          if [ -n "$SUFFIX" ]; then
            PRUNE_RE='win64-windows7\.zip$'
          else
            PRUNE_RE='win64\.zip$'
          fi
          for asset in $(gh release view continuous-build \
              --json assets --jq '.assets[].name' \
              | grep -E "$PRUNE_RE"); do
            gh release delete-asset continuous-build "$asset" -y || true
          done

          # Upload the stable-named asset.
          gh release upload continuous-build "$STABLE" --clobber

      - name: Compose release artifact list
        if: github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, '[Release]')
        shell: pwsh
        run: |
          # FORWARD SLASHES ONLY. ncipollo resolves `artifacts:` through the
          # `glob` package, where "\" is an ESCAPE character rather than a path
          # separator -- and ${{runner.workspace}} expands to "D:\a\vnote". The
          # 4.4.2 run passed "D:\a\vnote/build/VNote-4.4.2-win64.zip", glob read
          # it as "D:avnote/build/...", matched nothing, and the job still went
          # GREEN while uploading no assets at all.
          $base = ("${{runner.workspace}}/build/VNote-${{env.VNOTE_VER}}-win64${{matrix.config.suffix}}").Replace('\', '/')

          # The Qt5 `win64-windows7` variant publishes the ZIP only: it runs no
          # manifest/delta generation, so naming those files here would ask for
          # artifacts that are never produced.
          $required = if ('${{ matrix.config.qt_major }}' -eq '6') {
            @("$base.zip", "$base.manifest.json", "$base.manifest.json.minisig")
          } else {
            @("$base.zip")
          }

          # The delta is genuinely optional: the first release shipping this
          # feature has no predecessor manifest to diff against, so the
          # generator legitimately produces none. Include it only if it exists,
          # which keeps artifactErrorsFailBuild usable for everything else.
          $optional = if ('${{ matrix.config.qt_major }}' -eq '6') { @("$base.delta.zip") } else { @() }

          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing) {
            Write-Error "Required release artifact(s) missing: $($missing -join ', ')"
            exit 1
          }

          $list = $required + @($optional | Where-Object { Test-Path -LiteralPath $_ })
          "RELEASE_ARTIFACTS=$($list -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Release artifacts: $($list -join ', ')"

      - name: Release
        if: github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, '[Release]')
        uses: ncipollo/release-action@v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Both matrix jobs target the same draft (allowUpdates:true):
          # Qt6 -> ...win64.*, Qt5.15 -> ...win64-windows7.zip
          #
          # Composed by the step above rather than written literally, because
          # the two variants publish different asset sets and every entry must
          # already exist by the time we get here.
          artifacts: ${{ env.RELEASE_ARTIFACTS }}
          # Without this a failed or unmatched upload is only a warning, so a
          # release that attached NOTHING still reports success -- exactly how
          # the empty 4.4.2 draft was produced.
          artifactErrorsFailBuild: true
          commit: master
          tag: v${{env.VNOTE_VER}}
          allowUpdates: true
          # See the note in ci-linux.yml: release-action replaces the body and
          # name on update unless told otherwise, so a later platform job would
          # wipe the release notes set from changes.md.
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          draft: true

