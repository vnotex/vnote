name: Diagnose Windows Theme

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/Qt
          key: Windows-win64_msvc2022_64-QtCache-6.10.3

      - name: Install Qt Official Build
        uses: jurplel/install-qt-action@v3
        with:
          version: 6.10.3
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning qtpdf qtimageformats qt5compat
          cache: 'true'

      - name: Configure and build theme test
        shell: cmd
        env:
          VS_CMD: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat
        run: |
          call "%VS_CMD%"
          cmake -S . -B build-theme -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DVNOTE_BUILD_TESTS=ON || exit /b 1
          cmake --build build-theme --target test_themeservice || exit /b 1

      - name: Capture theme test log and process exit code
        shell: pwsh
        working-directory: build-theme/tests/gui
        run: |
          & ./test_themeservice.exe -o "theme-test.txt,txt"
          $testExit = $LASTEXITCODE
          Write-Host ("Theme test exit: {0} (0x{1:X8})" -f $testExit, ($testExit -band 0xffffffffL))
          if (Test-Path theme-test.txt) { Get-Content theme-test.txt }
          exit $testExit

      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-theme-diagnostics
          path: build-theme/tests/gui/theme-test.txt
          if-no-files-found: ignore
